    const arena = document.querySelector('#game .arena'), spots = list.length ? list.map(figScreen) : [{ x: arena.clientWidth / 2, y: arena.clientHeight / 2 }];
    for (const p of spots) { const el = document.createElement('div'); el.className = 'platefx' + (out ? ' out' : '') + (list.length ? '' : ' big'); el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
      el.innerHTML = `<div class="card r${pl.r}"><b>${esc(pl.n)}</b></div><i class="ring"></i>`; arena.appendChild(el); setTimeout(() => el.remove(), 1000); }
  }
  await sleep(1000);   // the original holds the sequence for the effect's second
}
