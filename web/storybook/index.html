  $('props').textContent = heard ? heard + '\n\n' + body : body;
  for (const b of $('nav').querySelectorAll('button')) b.classList.toggle('on', b.dataset.g === group && b.dataset.n === name);
  // A story whose figures carry a status condition or an MP change shows them without it first; after a second it is applied (ring, tint,
  // lettering, badge) and its sound plays, the way it arrives during a duel.
  (show.timers || []).forEach(clearTimeout); show.timers = [];
  const draw = x => { window.board3dModel = x; if (window.Board3D) Board3D.draw(x); };
  const job = ++demoJob;
  const oldGal = $('gal'); if (oldGal) oldGal.remove(); document.onkeydown = null; window.onhashchange = null;
  if (m.demo === 'gallery') {   // every figure by its number, stepped with ▲ / ▼
    const all = [...D.figures].sort((a, b) => a.no - b.no || a.id - b.id);
    const fromUrl = (p = decodeURIComponent(location.hash.slice(1)).split('/')[2]) => p == null || p === '' ? -1 : all.findIndex(f => f.no === +p);   // #Figure/Every figure/25 opens No. 25
    let k = fromUrl(pos); if (k < 0) { k = 0; try { k = Math.min(all.length - 1, Math.max(0, +localStorage.getItem('sb.gallery') || 0)); } catch (e) {} }
    const g = document.createElement('div'); g.id = 'gal'; $('board3d').appendChild(g);
    g.innerHTML = '<button data-d="-1" aria-label="Previous figure">▲</button><div class="lbl"></div><button data-d="1" aria-label="Next figure">▼</button>';
    const go = d => { k = (k + d + all.length) % all.length; try { localStorage.setItem('sb.gallery', k); } catch (e) {}
      const f = all[k]; history.replaceState(null, '', location.pathname + location.search + '#' + encodeURIComponent(group + '/' + name) + '/' + f.no); g.querySelector('.lbl').innerHTML = `<b>No. ${f.no}</b> ${f.n}<span>${k + 1} / ${all.length}</span>`; draw({ ...row([{ f }]) }); $('props').textContent = JSON.stringify({ no: f.no, id: f.id, name: f.n, dex: f.dex, mp: f.mp, img: art(f) }, null, 1); };
    g.onclick = e => { const b = e.target.closest('[data-d]'); if (b) go(+b.dataset.d); };
    document.onkeydown = e => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); go(e.key === 'ArrowUp' ? -1 : 1); } };
    window.onhashchange = () => { const i = fromUrl(); if (i >= 0 && i !== k) go(i - k); };
    go(0); return;
  }
  if (m.demo === 'move') { draw({ ...m, toks: m.toks.map(t => ({ ...t, moveId: null, path: null, x: (t._route || [[t.x, t.z]])[0][0], z: (t._route || [[t.x, t.z]])[0][1] })), snap: true }); loopMove(m, job); return; }
  if (m.demo === 'wheel' || m.demo === 'battle') { draw(m); if (m.demo === 'battle') { sfx('attack'); sfx('select'); } playWheel(m, job); return; }
  if (m.demo === 'ability') { draw(m); loopAbility(m, job); return; }
  if (m.demo === 'plate') { draw(m); loopPlate(m, job); return; }
  if (m.demo === 'fieldspin') { draw(m); loopFieldSpin(m, job); return; }
  // what arrives after the story opens, in order: each status condition, then each figure's MP change
  const playStatus = kind => { const row = COND_SOUND[kind]; if (row) sfx(row[2]); else statusSfx(kind); };
  const arrivals = [...new Set(m.toks.map(t => t.status).filter(Boolean))].map(kind => ({ hits: t => t.status === kind, sound: () => playStatus(kind) }))
    .concat(m.toks.filter(t => t.mpd).map(t => ({ hits: x => x === t, sound: () => mpSfx(t.mpd) })))
    .concat(m.toks.filter(t => t.wait).map(t => ({ hits: x => x === t, sound: () => sfx('wait') })))
    .concat(m.toks.filter(t => t.out != null).map(t => ({ hits: x => x === t, sound: () => sfx('st_other') })))
    .concat(m.toks.filter(t => t.dim && t.out == null).map(t => ({ hits: x => x === t, sound: () => sfx('ko') })))
    .concat(m.toks.filter(t => t.sel).map(t => ({ hits: x => x === t, sound: () => sfx('select') })))
    .concat(m.toks.filter(t => dmgSound(t)).map(t => ({ hits: x => x === t, sound: () => sfx(dmgSound(t)[2]) })));
  if (!arrivals.length) { draw(m); startEvo(); return; }
  const plain = t => ({ ...t, status: '', wait: false, mpd: 0, mp: t.mpd ? String(+t.mp - t.mpd) : t.mp, badge: t.status || t.mpd || t.wait || t.dim || t.sel || dmgSound(t) ? '' : t.badge, dim: false, sel: false });
  const upTo = n => ({ ...m, toks: m.toks.map(t => arrivals.findIndex(a => a.hits(t)) >= n ? plain(t) : t) });   // only the first n arrivals applied
  draw(upTo(0));
  arrivals.forEach((a, k) => show.timers.push(setTimeout(() => { draw(upTo(k + 1)); a.sound(); }, 1000 + k * 600)));
}

for (const g in STORIES) { $('nav').insertAdjacentHTML('beforeend', `<h2>${g}</h2>`); for (const n in STORIES[g]) { const b = document.createElement('button'); b.textContent = n; b.dataset.g = g; b.dataset.n = n; b.onclick = () => show(g, n); $('nav').appendChild(b); } }
let evoJob = 0;
function stopEvo() { evoJob++; const el = $('evoanim'); if (el) { el.hidden = true; el.innerHTML = ''; } if (window.Board3D && Board3D.clearBlasts) Board3D.clearBlasts(); stopDemo(); }
function evoSleep(ms, job) {   // ends early when Evolve is clicked (current.rush) or the story changes
  return new Promise(resolve => {
    const done = ok => { clearInterval(id); clearTimeout(t); resolve(ok); };
    const t = setTimeout(() => done(job === evoJob), ms);
    const id = setInterval(() => { if (job !== evoJob) done(false); else if (current && current.rush) { current.rush = false; done(true); } }, 40);
  });
}
function showForm(t, step) {
  const f = t.chain[step]; t.step = step; t.img = art(f); t.name = f.n; t.mp = String(f.mp); t.evo = t.branch || step < t.chain.length - 1;
  if (window.Board3D) Board3D.draw(current);
}
function flashEvo(t, job, reveal) {
  sfx('evolve');   // Se039 starts it, Se165 is the burst
  if (!(window.Board3D && Board3D.blast)) { if (job === evoJob && reveal) { reveal(); sfx('land'); } return Promise.resolve(); }
  const b = Board3D.blast(t.i);
  return (async () => {
    try { await b.ready; if (job === evoJob && reveal) { reveal(); sfx('land'); } }   // Se131, the new form lands
    finally { b.release(); }
    await b.done;
  })();
}
async function startEvo() {
  const job = ++evoJob;
  if (!current || !current.toks.some(t => t.chain && t.chain.length > 1)) return;
  while (!window.Board3D && job === evoJob) { if (!(await evoSleep(50, job))) return; }
  while (job === evoJob) {
    for (const t of current.toks) {
      if (!t.chain || t.chain.length < 2 || job !== evoJob) continue;
      if (t.branch) {
        for (let k = 1; k < t.chain.length && job === evoJob; k++) {
          showForm(t, 0); if (!(await evoSleep(700, job))) return;
          await flashEvo(t, job, () => showForm(t, k)); if (job !== evoJob) return;
          if (!(await evoSleep(900, job))) return;
        }
      } else {
        showForm(t, 0); if (!(await evoSleep(700, job))) return;
        for (let s = 0; s < t.chain.length - 1 && job === evoJob; s++) {
          await flashEvo(t, job, () => showForm(t, s + 1)); if (job !== evoJob) return;
          if (!(await evoSleep(900, job))) return;
        }
      }
    }
  }
}
window.boardPick = (fig, pt, act) => {   // click a figure to toggle its selection ring; Evolve skips the wait and plays the next step
  if (act && String(act).startsWith('evo:')) { if (current) current.rush = true; return; }
  if (fig == null || !current) return;
  const picked = current.toks.find(t => t.i === fig);
  const on = picked && !picked.sel;
  for (const t of current.toks) t.sel = t.i === fig && !t.sel;
  sfx(on ? 'select' : 'cancel');   // Se028 selects, Se029 cancels
  Board3D.draw(current);
};
const [g0, n0] = decodeURIComponent(location.hash.slice(1)).split('/');
addEventListener('spritemotion', () => { const [g, n] = decodeURIComponent(location.hash.slice(1)).split('/'); if (STORIES[g] && STORIES[g][n]) show(g, n); });   // Animated / Still switched: redraw the story   // a third part is a story's own position (Every figure: the figure number)
import(new URL('board3d.js?v=leap2', document.baseURI)).then(() => show(...(STORIES[g0] && STORIES[g0][n0] ? [g0, n0] : ['Figure', 'Interaction states'])));
</script>
